<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A350 Mobile & PC Flight</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        .overlay {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(135, 206, 235, 0.9), rgba(30, 144, 255, 0.8));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: white; text-align: center;
        }
        h1 { font-size: clamp(30px, 8vw, 55px); margin-bottom: 10px; }
        .btn {
            width: 80%; max-width: 320px; padding: 15px; margin: 8px; font-size: 18px;
            cursor: pointer; border: 2px solid white; border-radius: 50px; 
            background: rgba(255, 255, 255, 0.2); color: white; font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: white; color: #1e90ff; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; display: none; font-weight: bold; pointer-events: none; }
        #progress-container { position: absolute; top: 20px; right: 20px; width: 30%; max-width: 200px; height: 10px; background: rgba(255,255,255,0.4); border-radius: 10px; display: none; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #ffffff; }
        /* スマホ用操作ガイド */
        #touch-guide { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-size: 14px; opacity: 0.6; pointer-events: none; display: none; }
    </style>
</head>
<body>

    <div id="menu" class="overlay">
        <h1>A350 Flight</h1>
        <p>画面をスワイプ、または矢印キーで操縦</p>
        <button class="btn" onclick="startGame(1.5, 4000, 15)">簡単 (Short)</button>
        <button class="btn" onclick="startGame(2.5, 9000, 12)">普通 (Medium)</button>
        <button class="btn" onclick="startGame(4.0, 18000, 10)">困難 (Long)</button>
    </div>

    <div id="result" class="overlay" style="display: none;">
        <h1>FLIGHT COMPLETE!</h1>
        <p id="final-score" style="font-size: 30px;"></p>
        <button class="btn" onclick="location.reload()">再挑戦</button>
    </div>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="touch-guide">画面スワイプで上下左右に移動</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let gameStarted = false;
        let speed = 0, score = 0, goalDistance = 0, ringRadius = 5;
        const keys = {};
        const touchPos = { x: 0, y: 0, active: false };

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 200, 1200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(100, 200, 100);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // Airplane (A350)
        const airplane = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 6, 16), bodyMat);
        body.rotation.x = Math.PI / 2;
        airplane.add(body);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(9, 0.1, 2), bodyMat);
        airplane.add(wing);
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 1.2), new THREE.MeshStandardMaterial({color: 0x003399}));
        tail.position.set(0, 1, -2.5);
        airplane.add(tail);
        scene.add(airplane);
        airplane.position.y = 50;

        // Ground & City
        const cityGroup = new THREE.Group();
        const buildGeo = new THREE.BoxGeometry(20, 1, 20);
        for (let i = 0; i < 400; i++) {
            const h = Math.random() * 50 + 10;
            const build = new THREE.Mesh(buildGeo, new THREE.MeshStandardMaterial({ color: 0xcccccc }));
            build.position.set((Math.random()-0.5)*800, h/2, -Math.random()*10000);
            build.scale.y = h;
            cityGroup.add(build);
        }
        scene.add(cityGroup);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 20000), new THREE.MeshStandardMaterial({ color: 0x999999 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Rings
        let rings = [];
        function createRings(radius) {
            const ringGeo = new THREE.TorusGeometry(radius, 0.5, 12, 32);
            const ringMat = new THREE.MeshToonMaterial({ color: 0xffd700 });
            for (let i = 0; i < 25; i++) {
                const ring = new THREE.Mesh(ringGeo, ringMat);
                resetRing(ring, -600 - (i * 300));
                scene.add(ring);
                rings.push(ring);
            }
        }
        function resetRing(ring, zPos) {
            ring.position.set((Math.random() - 0.5) * 120, Math.random() * 60 + 20, zPos);
        }

        // --- Controls (Keyboard & Touch) ---
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        window.addEventListener('touchstart', (e) => {
            touchPos.active = true;
            updateTouchPos(e.touches[0]);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (touchPos.active) updateTouchPos(e.touches[0]);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            touchPos.active = false;
            touchPos.x = 0; touchPos.y = 0;
        });

        function updateTouchPos(touch) {
            // 中心を0として-1から1の範囲に変換
            touchPos.x = (touch.clientX / window.innerWidth) * 2 - 1;
            touchPos.y = -((touch.clientY / window.innerHeight) * 2 - 1);
        }

        window.startGame = function(s, d, r) {
            speed = s; goalDistance = d; ringRadius = r;
            createRings(r);
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('touch-guide').style.display = 'block';
        };

        function animate() {
            requestAnimationFrame(animate);
            if (gameStarted) {
                airplane.position.z -= speed;
                const traveled = Math.abs(airplane.position.z);
                document.getElementById('progress-bar').style.width = Math.min((traveled / goalDistance) * 100, 100) + '%';

                if (traveled >= goalDistance) {
                    gameStarted = false;
                    document.getElementById('result').style.display = 'flex';
                    document.getElementById('final-score').innerText = "SCORE: " + score;
                    return;
                }

                // Movement Logic
                let moveX = 0, moveY = 0;
                if (keys['ArrowUp'] || keys['KeyW']) moveY = 1;
                if (keys['ArrowDown'] || keys['KeyS']) moveY = -1;
                if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
                if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;

                // Touch override
                if (touchPos.active) {
                    moveX = touchPos.x * 1.5; 
                    moveY = touchPos.y * 1.5;
                }

                airplane.position.x += moveX * speed * 0.8;
                airplane.position.y += moveY * speed * 0.8;
                airplane.position.y = Math.max(10, Math.min(120, airplane.position.y));

                // Tilt effect
                airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, -moveX * 0.6, 0.1);
                airplane.rotation.x = THREE.MathUtils.lerp(airplane.rotation.x, moveY * 0.3, 0.1);

                camera.position.lerp(new THREE.Vector3(airplane.position.x, airplane.position.y + 5, airplane.position.z + 25), 0.1);
                camera.lookAt(airplane.position.x, airplane.position.y, airplane.position.z - 20);

                // Recycle Logic
                cityGroup.children.forEach(b => { if (b.position.z > airplane.position.z + 200) b.position.z -= 10000; });
                rings.forEach(ring => {
                    if (airplane.position.distanceTo(ring.position) < ringRadius + 2) {
                        score += 100;
                        document.getElementById('score').innerText = score;
                        resetRing(ring, airplane.position.z - 4000);
                    }
                    if (ring.position.z > airplane.position.z + 100) resetRing(ring, airplane.position.z - 4000);
                });
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
